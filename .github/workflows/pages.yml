# Publishes the board to GitHub Pages. Each deploy stamps the commit sha it
# builds (R6), so the live page names the exact build it runs.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stamp the build sha (R6)
        run: |
          # the build is the app; name the last commit that changed it, so
          # evidence recordings pushed after a take don't move the page's sha
          APP_SHA="$(git log -1 --format=%H -- app/)"
          node scripts/stamp-build.mjs "$APP_SHA"
      - name: Include evidence recordings (served as video/webm)
        run: |
          if [ -d recordings ]; then cp -r recordings dist/recordings; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
